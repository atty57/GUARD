  - {id: P3,   maker: Brenner Power,   cathode: NCM811, format: pouch,       anode: Si-graphite, region: Europe, sop_year: "2028"}
  - {id: CX,   maker: Calder Batteries, cathode: NCA,   format: cylindrical, anode: Si-graphite, region: NA,     sop_year: "2027"}
  - {id: D5,   maker: Dovre Cell,      cathode: NCM88,  format: prismatic,   anode: graphite,    region: Europe, sop_year: "2027"}
  - {id: E2,   maker: Elmstead Energy, cathode: NCM811, format: pouch,       anode: graphite,    region: Korea,  sop_year: "2027"}
