# Candidate products an outside observer could confuse with ours: the "crowd" for the profile
# check (k-anonymity-style, guard/profile.py). All makers and products are fictional.
#
# k = how many products below still fit every attribute the sent queries have revealed about
# our own product (`target`). Terms that rule our product out ("LFP cells ...") reveal nothing
# about it and are ignored. If a draft would push k under the policy's k_min, the guard blocks it.
#
# Dev split only (Halden HX-9 + 15 others). Test-split companies get their own catalog, kept
# out of the repo with the rest of the test split.

attributes:
  # term (as it appears in a query) -> catalog values it covers. Broader terms cover more.
  cathode:
    "NCM811": [NCM811]
    "NCM 811": [NCM811]
    "NMC811": [NCM811]
    "NMC 811": [NCM811]
    "NCM88": [NCM88]
    "NCM 88": [NCM88]
    "NMC88": [NCM88]
    "NMC 88": [NCM88]
    "high-nickel": [NCM811, NCM88, NCA]
    "high nickel": [NCM811, NCM88, NCA]
    "Ni-rich": [NCM811, NCM88, NCA]
    "nickel-rich": [NCM811, NCM88, NCA]
    "NCA": [NCA]
    "NCM622": [NCM622]
    "LFP": [LFP]
    "LMFP": [LMFP]
  format:
    "pouch": [pouch]
    "cylindrical": [cylindrical]
    "prismatic": [prismatic]
  anode:
    "silicon anode": [Si-graphite]
    "Si anode": [Si-graphite]
    "Si-graphite": [Si-graphite]
    "silicon-graphite": [Si-graphite]
    "silicon-carbon": [Si-graphite]
  region:
    "Europe": [Europe]
    "European": [Europe]
    "EU": [Europe]
    "North America": [NA]
    "North American": [NA]
    "Korean": [Korea]
    "Chinese": [China]
  sop_year:
    "SOP 2026": ["2026"]
    "SOP 2027": ["2027"]
    "SOP 2028": ["2028"]

# A region term only counts as the product's market when the query is about customers or
# supply ("OEM", "supplier", ...); "Korea national core technology list" names a law, not a market.
region_context: "\\b(OEMs?|suppliers?|platforms?|markets?|customers?|automakers?|carmakers?)\\b"

target: HX-9

products:
  - {id: HX-9, maker: Halden Cells,    cathode: NCM88,  format: pouch,       anode: Si-graphite, region: Europe, sop_year: "2027"}
