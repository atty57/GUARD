  - {id: G8,   maker: Gorlitz Zellen,  cathode: NCM88,  format: pouch,       anode: graphite,    region: Europe, sop_year: "2028"}
  - {id: H4,   maker: Hollin Power,    cathode: LFP,    format: prismatic,   anode: graphite,    region: China,  sop_year: "2026"}
